name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit, adversarial and dashboard tests
        # Tests that need the raw ESPEN download skip themselves here: raw data are
        # never committed. They run locally after `lf-mda download`.
        run: python -m pytest -q
