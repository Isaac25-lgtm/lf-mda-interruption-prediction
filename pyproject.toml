[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lf-mda"
version = "0.1.0"
description = "Feasibility audit and prediction of reported lymphatic filariasis MDA interruptions in African implementation units using public WHO ESPEN data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omoding Isaac" }]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "catboost>=1.2",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pypdf>=4"]

[project.scripts]
lf-mda = "lf_mda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
