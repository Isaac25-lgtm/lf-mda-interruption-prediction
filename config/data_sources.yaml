# Data sources actually used. Verified 2026-10-12.
#
# The ESPEN "Download data" form (public, no login, no key, no terms click-through)
# calls the path below from the browser. The path template is published by the site
# itself in /sites/default/files/remora_core.routes.json.js under the route name
# `espen_doctrine.download_data`. robots.txt does not disallow /api/.
espen_lf:
  form_url: https://espen.afro.who.int/maps-data/data-query-tools/download-data
  base_url: https://espen.afro.who.int
  path_template: /api/download-data/{country}/{disease}/{level}/{from_year}/{to_year}
  disease: lf
  level: iu
  from_year: 2014
  to_year: 2025
  dictionary_url: https://espen.afro.who.int/sites/default/files/content/document/Lymphatic_Filariasis_EN_FR_PT.pdf
  updates_url: https://espen.afro.who.int/maps-data/data-updates
  request_delay_seconds: 3
  # Country codes exactly as offered by the form's country selector (48 entries).
  # ZZ is ESPEN's own code for Tanzania (Zanzibar).
  countries:
    - {iso2: DZ, name: "Algeria"}
    - {iso2: AO, name: "Angola"}
    - {iso2: BJ, name: "Benin"}
    - {iso2: BW, name: "Botswana"}
    - {iso2: BF, name: "Burkina Faso"}
    - {iso2: BI, name: "Burundi"}
    - {iso2: CM, name: "Cameroon"}
